<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Live Location Tracker</title>
        <style>
            body {
                background-color: black;
                color: white;
            }
            #map {
                height: 90vh;
            }
        </style>
        <link
            rel="stylesheet"
            href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
            integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
            crossorigin=""
        />

        <script
            src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
            integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
            crossorigin=""
        ></script>
    </head>
    <body>
        <h1>Live Location Tracker</h1>
        <div id="map"></div>

        <script src="/socket.io/socket.io.js"></script>
        <script>
            const socket = io();
            var map = L.map("map").setView([51.505, -0.09], 13);
            L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
                maxZoom: 19,
                attribution: '&copy; <a href="http://www.openstreetmap.org/copyright">OpenStreetMap</a>',
            }).addTo(map);

            function getUserCurrentLocation() {
                return new Promise((resolve, reject) => {
                    if ("geolocation" in navigator) {
                        navigator.geolocation.getCurrentPosition(
                            (position) => {
                                console.log(`Got User Current Position -`, position);
                                const latitude = position.coords.latitude;
                                const longitude = position.coords.longitude;
                                const accuracy = position.coords.accuracy;
                                resolve({ latitude, longitude, accuracy });
                            },
                            (error) => {
                                reject(error);
                            },
                            { enableHighAccuracy: true, timeout: 7 * 1000 },
                        );
                    } else {
                        alert("Your browser does not support Geolocation");
                    }
                });
            }

            // Store the circle and marker reference outside globally
            let myCurrentLocationMarker = null;
            let accuracyCircle = null;

            async function updateLocation() {
                try {
                    const { latitude, longitude, accuracy } = await getUserCurrentLocation();
                    const latLng = [latitude, longitude];
                    socket.emit("client:location:update", latLng);

                    // 1. Manage Marker
                    if (!myCurrentLocationMarker) {
                        myCurrentLocationMarker = L.marker(latLng).addTo(map).bindPopup("You are here").openPopup();
                    } else {
                        myCurrentLocationMarker.setLatLng(latLng);
                    }

                    // 2. update Accuracy Circle
                    if (!accuracyCircle) {
                        accuracyCircle = L.circle(latLng, {
                            radius: accuracy,
                            color: "#0074D9",
                            fillColor: "#7FDBFF",
                            fillOpacity: 0.3,
                        }).addTo(map);
                    } else {
                        accuracyCircle.setLatLng(latLng);
                        accuracyCircle.setRadius(accuracy);
                    }

                    // 3. Update Map View
                    map.fitBounds(accuracyCircle.getBounds());
                } catch (error) {
                    console.error("Error updating location:", error.message);
                }
            }

            window.addEventListener("load", updateLocation);
            setInterval(updateLocation, 10 * 1000);
        </script>
    </body>
</html>
